<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Core SEO -->
    <title>Time Manager — Online Productivity Timer</title>
    <meta
      name="description"
      content="Free time manager and focus timer. Track your work sessions, take breaks, and boost your personal efficiency with ease."
    />
    <link rel="canonical" href="https://tolikhere.github.io/time-manager/" />

    <!-- Open Graph (Social Media) -->
    <meta
      property="og:title"
      content="Time Manager — Your Personal Time Management Tool"
    />
    <meta
      property="og:description"
      content="Simple work and study timer right in your browser."
    />
    <meta
      property="og:url"
      content="https://tolikhere.github.io/time-manager/"
    />
    <meta property="og:type" content="website" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css?v=58" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div class="mobile-ui">
      <header>
        <h1 id="mode-title">💻 Working hours</h1>
      </header>
      <main>
        <div class="timer">
          <p id="display" class="time">00:25:00</p>
          <div class="progress-container">
            <div id="bar" class="progress-bar"></div>
          </div>
          <div class="flex-horizon">
            <button id="start" class="btn start" aria-label="Start Timer">
              <svg
                xmlns="http://www.w3.org"
                width="50"
                height="50"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>
            <button id="reset" class="btn reset" aria-label="Reset Timer">
              <svg
                xmlns="http://www.w3.org"
                width="50"
                height="50"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="stats">
          <p>Completed sessions: <span id="session-count">0/4</span></p>
          <div class="session-icons" id="session-icons">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <button id="clear" class="btn clear">Clear</button>
        </div>
      </main>

      <footer>
        <p>&copy; 2026 Time Manager Tool</p>
      </footer>
    </div>
    <script src="./js/app.js?v=58"></script>
  </body>
</html>
