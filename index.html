<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css" />
  <title>Time Manager</title>
</head>
<body>
  <div class="mobile-ui">
    <header>
      <h1 id="mode-title">💻 Working hours</h1>
    </header>
    <main>
      <div class="timer top-border">
        <p id="display" class="time">00:25:00</p>
        <div class="progress-container">
          <div id="bar" class="progress-bar"></div>
        </div>
        <button id="start" class="btn start">Start</button>
        <button id="pause" class="btn pause">Pause</button>
        <button id="reset" class="btn reset">Reset</button>
      </div>
      <div class="stats">
        <p>Completed sessions: <span id="session-count">0/4</span></p>
        <div class="session-icons" id="session-icons">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </main>
  </div>
  <script src="./js/app.js"></script>
</body>
</html>
