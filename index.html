<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css" />
  <title>Time Manager</title>
</head>
<body>
  <div class="mobile-ui">
    <header>
      <h1>Timer</h1>
    </header>
    <main>
      <div class="timer top-border">
        <p id="display-1" class="time">00:25:00</p>
        <div class="progress-container">
          <div id="bar-1" class="progress-bar"></div>
        </div>
        <button id="start-1" class="btn start">Start</button>
        <button id="pause-1" class="btn pause">Pause</button>
        <button id="reset-1" class="btn reset">Reset</button>
      </div>
      
      <div class="timer top-border">
        <p id="display-2" class="time">00:05:00</p>
        <div class="progress-container">
          <div id="bar-2" class="progress-bar"></div>
        </div>
        <button id="start-2" class="btn start">Start</button>
        <button id="pause-2" class="btn pause">Pause</button>
        <button id="reset-2" class="btn reset">Reset</button>
      </div>
    </main>
  </div>
  <script src="./js/app.js"></script>
</body>
</html>
