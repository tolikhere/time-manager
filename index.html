<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <title>Time Manager</title>
</head>
<body>
  <div class="mobile-ui">
    <header>
      <h1 id="mode-title">💻 Working hours</h1>
    </header>
    <main>
      <div class="timer top-border">
        <p id="display" class="time">00:25:00</p>
        <div class="progress-container">
          <div id="bar" class="progress-bar"></div>
        </div>
        <div class="flex-horizon">
          <button id="start" class="btn start" aria-label="Start Timer">
            <svg xmlns="http://www.w3.org" width="50" height="50" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>
          <button id="reset" class="btn reset" aria-label="Reset Timer">
            <svg xmlns="http://www.w3.org" width="50" height="50" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="stats">
        <p>Completed sessions: <span id="session-count">0/4</span></p>
        <div class="session-icons" id="session-icons">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <button id="clear" class="btn clear">Clear</button>
      </div>
    </main>
  </div>
  <script src="./js/app.js"></script>
</body>
</html>
